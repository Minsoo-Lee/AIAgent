server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  ai:
    mcp:
      client:
        streamable-http:
          connections:
            tavily:
              url: https://mcp.tavily.com/mcp/?tavilyApiKey=${TAVILY_API_KEY}
    google:
      genai:
        project-id: ${GOOGLE_CLOUD_PROJECT_ID}
        api-key: ${GEMINI_API_KEY}

        chat:
          options:
            model: gemini-3.5-flash-lite

        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/springai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  application:
    name: aiAgent