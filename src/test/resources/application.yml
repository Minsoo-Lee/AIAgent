spring:
  ai:
    google:
      genai:
        api-key: test-key
        chat:
          options:
            model: gemini-2.5-flash-lite
        embedding:
          api-key: test-key
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
    mcp:
      client:
        stdio:
          connections:
            filesystem:
              command: npx
              args:
                - -y
                - "@modelcontextprotocol/server-filesystem"
                - "/tmp"
        streamable-http:
          connections:
            tavily:
              url: https://mcp.tavily.com
              endpoint: /mcp/?tavilyApiKey=test-key
            github:
              url: https://api.githubcopilot.com/mcp/
        toolcallback:
          enabled: true
        initialized: false
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE

  datasource:
    url: jdbc:postgresql://localhost:5432/springai
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

github:
  token: test-token

jwt:
  secret: test-secret-key-for-jwt-signing-must-be-long-enough
  expiration: 86400000